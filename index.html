<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beauty Spot 2.0</title>
<style>
*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#fff5f8;color:#222;padding:14px}
h1{text-align:center;color:#d63384;margin:5px} .sub{text-align:center;color:#888;font-size:13px}
.cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.card{background:#fff;border-radius:12px;padding:10px;text-align:center;box-shadow:0 2px 8px #0001}
.card b{font-size:18px;display:block;color:#d63384}.card span{font-size:11px;color:#777}
.box{background:#fff;padding:14px;border-radius:14px;box-shadow:0 2px 10px #0001;margin-bottom:12px}
input,select{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;border-radius:10px;font-size:15px}
button{width:100%;padding:13px;background:#d63384;color:#fff;border:0;border-radius:10px;font-size:16px;font-weight:bold}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left}
.del{color:red;background:none;width:auto;padding:0;font-size:13px}
.leader{font-size:14px;line-height:1.8}
</style></head>
<body>
<h1>💇‍♀️ Beauty Spot 2.0</h1><div class="sub">Salon Manager • Money • M-Pesa • Reports</div>

<div class="cards">
<div class="card"><b id="today">KSh 0</b><span>TODAY</span></div>
<div class="card"><b id="week">KSh 0</b><span>THIS WEEK</span></div>
<div class="card"><b id="month">KSh 0</b><span>THIS MONTH</span></div>
</div>

<div class="box">
<h3 style="margin:0">➕ New Customer</h3>
<input id="cust" placeholder="Customer Name e.g. Wanjiku">
<select id="staff"><option>Rachael</option><option>Dorine</option><option>Betty</option><option>Kany</option></select>
<select id="service"><option value="Braiding|1500">Braiding - 1500</option><option value="Knotless Braids|2500">Knotless Braids - 2500</option><option value="Dreadlocks|2000">Dreadlocks - 2000</option><option value="Manicure|800">Manicure - 800</option><option value="Pedicure|1000">Pedicure - 1000</option><option value="Hair Wash & Blowdry|700">Hair Wash & Blowdry - 700</option><option value="Weaving|3000">Weaving - 3000</option></select>
<select id="pay"><option>Cash</option><option>M-Pesa</option></select>
<input id="mpesa" placeholder="M-Pesa Code (if M-Pesa)" style="display:none">
<input id="price" type="number" placeholder="Price - auto filled">
<button onclick="add()">Save Customer ✅</button>
</div>

<div class="box"><h3 style="margin:0">🏆 Staff Leaderboard</h3><div id="leader" class="leader"></div></div>

<div class="box"><h3 style="margin:0">📋 All Records</h3>
<table><thead><tr><th>Customer</th><th>Service</th><th>Staff</th><th>Pay</th><th>KSh</th><th></th></tr></thead><tbody id="list"></tbody></table>
</div>

<script>
let data=JSON.parse(localStorage.getItem('bs2')||'[]');
let service=document.getElementById('service'), price=document.getElementById('price'), pay=document.getElementById('pay'), mpesa=document.getElementById('mpesa');
function syncPrice(){price.value=service.value.split('|')[1]}
syncPrice(); service.onchange=syncPrice;
pay.onchange=()=>{mpesa.style.display=pay.value==='M-Pesa'?'block':'none'};
function add(){
 let name=document.getElementById('cust').value.trim(); if(!name) return alert('Enter customer name');
 let [s,p]=service.value.split('|');
 data.unshift({name,staff:document.getElementById('staff').value,service:s,price:+price.value||0,pay:pay.value,code:mpesa.value,date:new Date().toISOString().slice(0,10)});
 localStorage.setItem('bs2',JSON.stringify(data)); document.getElementById('cust').value=''; mpesa.value=''; render();
}
function del(i){if(confirm('Delete?')){data.splice(i,1);localStorage.setItem('bs2',JSON.stringify(data));render();}}
function render(){
 let now=new Date(), todayStr=now.toISOString().slice(0,10);
 let t=0,w=0,m=0; let staffTot={};
 data.forEach(d=>{
   if(d.date===todayStr) t+=d.price;
   let dDate=new Date(d.date); let diff=(now-dDate)/(1000*60*60*24);
   if(diff<7) w+=d.price;
   if(dDate.getMonth()===now.getMonth()&&dDate.getFullYear()===now.getFullYear()) m+=d.price;
   staffTot[d.staff]=(staffTot[d.staff]||0)+d.price;
 });
 document.getElementById('today').textContent='KSh '+t.toLocaleString();
 document.getElementById('week').textContent='KSh '+w.toLocaleString();
 document.getElementById('month').textContent='KSh '+m.toLocaleString();
 document.getElementById('leader').innerHTML=Object.entries(staffTot).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`⭐ ${k}: <b>KSh ${v.toLocaleString()}</b>`).join('<br>')||'No sales yet';
 document.getElementById('list').innerHTML=data.map((d,i)=>`<tr><td>${d.name}<br><small>${d.date} ${d.code? '• '+d.code:''}</small></td><td>${d.service}</td><td>${d.staff}</td><td>${d.pay}</td><td>${d.price}</td><td><button class="del" onclick="del(${i})">✕</button></td></tr>`).join('')||'<tr><td colspan=6>No records</td></tr>';
}
render();
</script></body></html>
